# Standalone production stack — not an override of docker-compose.yml (that one publishes
# Postgres's port and has no TLS/reverse-proxy story, both fine for local dev, neither fine for
# a public VPS). Deliberately self-contained rather than layered with `-f` on top of the base
# file: Compose concatenates list fields like `ports` across layered files instead of replacing
# them, so an override that tries to *remove* a port mapping can silently leave the original
# exposed anyway. Easier to audit as one file for something security-sensitive like this.
#
# Usage: see DEPLOY.md.

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No published port. Only `app`, on this same compose network, ever needs to reach
    # Postgres — nothing outside this stack should be able to talk to it directly.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PORT: 3001
    # Reachable only from `caddy` over the compose network — not published to the host, so
    # the only way in from outside this machine is through Caddy's TLS-terminated proxy.
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # A real domain gets automatic Let's Encrypt HTTPS; left unset, Caddy falls back to
      # plain HTTP on "localhost" — fine for kicking the tires by IP before DNS is set up,
      # but put a domain here before you rely on this for anything real. See DEPLOY.md.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
