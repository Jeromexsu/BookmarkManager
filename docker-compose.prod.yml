# Standalone production stack — not an override of docker-compose.yml (that one publishes
# Postgres's port straight to the host, fine for local dev, not for a public VPS).
# Deliberately self-contained rather than layered with `-f` on top of the base file: Compose
# concatenates list fields like `ports` across layered files instead of replacing them, so an
# override that tries to *remove* a port mapping can silently leave the original exposed
# anyway. Easier to audit as one file for something security-sensitive like this.
#
# No reverse proxy / TLS termination in here — that's assumed to already exist on the host
# (nginx, in this deploy) fronting other things too. `app` binds to 127.0.0.1 only, for that
# existing proxy to reach; nothing public talks to this stack directly. See DEPLOY.md.

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No published port. Only `app`, on this same compose network, ever needs to reach
    # Postgres — nothing outside this stack should be able to talk to it directly.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      PORT: 3001
    # Bound to loopback only — reachable from the host's own nginx, not from outside this
    # machine. nginx is what actually terminates TLS and faces the public internet.
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"

volumes:
  db-data:
